  <!-- Marca de agua -->
  <g text-anchor="middle">
    <text x="640" y="690" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#8b5cf6" opacity="0.75">ORDERFLOW</text>
