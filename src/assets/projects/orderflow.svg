<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Captura de OrderFlow">
  <defs>
    <linearGradient id="bg-orderflow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d11"/>
      <stop offset="100%" stop-color="#15151a"/>
    </linearGradient>
    <radialGradient id="glow-orderflow" cx="0.25" cy="0.15" r="0.9">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar-orderflow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg-orderflow)"/>
  <rect width="1280" height="720" fill="url(#glow-orderflow)"/>

  <!-- Ventana del navegador -->
